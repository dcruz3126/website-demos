headline: "The systems behind the work."

intro: >
  I build practical websites, local search systems and automation
  for contractors who are busy running their businesses.

story: ""

approach:
  - title: "Practical"
    text: >
      Build systems around how the business actually operates,
      rather than forcing the business into unnecessary software.

  - title: "Maintainable"
    text: >
      Keep systems understandable, documented and manageable.

  - title: "Automated where it matters"
    text: >
      Automate repetitive work that would otherwise get forgotten,
      delayed or handled manually.

  - title: "Built to grow"
    text: >
      Start with the essentials and add systems as the business grows.
