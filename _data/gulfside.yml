services:
  - name: "Test Service"
    info: "This is a test to see if services updates via yml"
  - name: "Drain cleaning"
    info: "Kitchen sink backing up, tub draining slow, or a main line that's had enough. We clear it and check for the root cause so it stays clear."
  - name: "Leak detection & repair"
    info: "Rising water bill with no obvious cause? We track down hidden leaks in walls, slabs, and yards before they turn into real damage."
  - name: "Water heater repair & install"
    info: "Cold showers are not a personality trait. We service and install both tank and tankless units, gas or electric."
  - name: "Pipe repiping"
    info: "Aging or corroded pipes replaced with durable materials built for Florida's water and heat, with minimal disruption to your home."
  - name: "Toilet & fixture installation"
    info: "New toilets, faucets, sinks, and showerheads installed cleanly and sealed properly the first time."
  - name: "Garbage disposal repair"
    info: "Jammed, humming, or just gone quiet. We diagnose and repair or replace your disposal fast."
  - name: "Sewer line services"
    info: "Camera inspections, clearing, and repair for main sewer lines, so problems get caught before they surface in your yard."
  - name: "Emergency plumbing"
    info: "Burst pipes, major leaks, and overflowing fixtures don't wait for business hours. Neither do we."
