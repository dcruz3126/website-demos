services:
  - name: "Kitchen Remodeling"
    info: "Full kitchen renovations with custom layouts, cabinetry, countertops, backsplash, lighting, and appliances. We design it, build it, and manage every detail."
  - name: "Bathroom Remodeling"
    info: "Walk-in showers, soaking tubs, vanities, and tile, built with proper waterproofing so your new bathroom looks great for years to come."
  - name: "Whole-Home Renovations"
    info: "Updating the whole house at once? We coordinate design, permits, trades, and timelines so the entire project runs smoothly from start to finish."
  - name: "Room Additions"
    info: "Extra bedroom, bigger family room, or a new primary suite. We build additions that match your home's style and structure."
  - name: "Flooring Installation"
    info: "Hardwood, tile, luxury vinyl, and laminate installed with careful prep so your floors look flawless and hold up to daily life."
  - name: "Cabinets & Countertops"
    info: "Custom, semi-custom, and refaced cabinets paired with granite, quartz, or butcher block counters for a polished, lasting upgrade."
  - name: "Trim, Drywall & Painting"
    info: "Drywall repair, trim and crown molding, doors, and clean interior and exterior painting that ties every room together."
  - name: "Outdoor Living Spaces"
    info: "Covered patios, outdoor kitchens, decks, and screened living areas built to handle Florida sun, rain, and entertaining."
