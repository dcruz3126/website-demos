home_services:
  - name: "Kitchen Remodeling"
    info: "Cabinets, counters, lighting, and layout, all designed and built by one team. We create kitchens that look great and work harder for your family."
  - name: "Bathroom Remodeling"
    info: "Spa-worthy showers, vanities, and tile, from quick refreshes to full gut renovations, finished cleanly and built to last."
  - name: "Whole-Home Renovations"
    info: "Planning to update more than one room? We manage the entire project from permits to paint so you deal with one team, not ten."
  - name: "Room Additions & Expansions"
    info: "Need more space? We build room additions, bump-outs, and expansions that blend seamlessly with the home you already have."
how_it_works:
  - name: "You Call"
    info: "Tell us about your project and what you wish your home did better. We'll ask a few quick questions and schedule a free consultation."
  - name: "We diagnose"
    info: "We visit your home, take measurements, and walk you through design ideas, options, and pricing in plain English."
  - name: "We fix it"
    info: "Our crew protects your space, handles permits, and builds to plan. You get regular updates, and no surprises."
  - name: "You relax"
    info: "Final walkthrough, a spotless cleanup, and a warranty on the work. Enjoy your new space."
