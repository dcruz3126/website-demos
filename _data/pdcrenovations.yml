how_it_works:
  - name: "You Call"
    info: "Tell us what needs fixing or what you want to build. We'll ask a few quick questions and schedule a free estimate."
  - name: "We diagnose"
    info: "We visit your home, inspect the work, and walk you through the options and pricing in plain English."
  - name: "We fix it"
    info: "Our crew protects your space, handles permits, and gets to work. You get regular updates and no surprises."
  - name: "You relax"
    info: "Final walkthrough, a spotless cleanup, and a warranty on the work. Enjoy the finished result."
