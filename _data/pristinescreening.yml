services:
  - name: "Pool Cage & Lanai Rescreening"
    info: "Torn, sagging, or sun-damaged screens replaced with durable mesh. We rescreen pool cages, lanais, and patio enclosures so you can enjoy the outdoors bug free."
  - name: "Pressure Washing & Soft Washing"
    info: "Algae, mildew, oil stains, and years of buildup removed from driveways, sidewalks, roofs, siding, and pool decks, using the right pressure for each surface."
  - name: "Pool Cage Repainting"
    info: "Faded, chalky, or peeling cage frames get a careful prep and a durable coat that resists corrosion and keeps your enclosure looking sharp."
  - name: "Interior Painting"
    info: "Fresh walls, ceilings, and trim with clean lines and zero mess. We move, cover, and protect your furniture and floors so you can enjoy the new look right away."
  - name: "Exterior Painting"
    info: "A quality exterior paint job protects your home from Florida sun, humidity, and storms. We prep, repair, and paint for a finish that lasts."
  - name: "Cabinet Refinishing"
    info: "Tired cabinets don't need a full remodel. We clean, sand, prime, and finish them for a smooth, factory-style look at a fraction of the cost."
  - name: "Epoxy Floor Coatings"
    info: "Garage, patio, and pool deck floors coated with tough, glossy epoxy that resists stains, chemicals, and hot tires, and cleans up easily."
  - name: "Gutter Cleaning & Maintenance"
    info: "Clogged gutters cause leaks, rot, and foundation trouble. We clear, flush, and inspect your gutters and downspouts so water flows where it should."
