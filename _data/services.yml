services:

  - id: website-design
    title: "Website Design"
    short_title: "Web Design"
    category: "Get Found"
    description: >
      A professional website that clearly explains what you do,
      where you work, and how customers can reach you.
    icon: "⌂"
    url: "/services/web-design/"
    featured: true

    packages:
      foundation: true
      framework: true
      buildout: true

    page:
      headline: "A website that works while you're working."
      intro: >
        When you're on a job, customers shouldn't have to wait around
        to figure out what you do, whether you serve their area, or how
        to get in touch.

      sections:

        - heading: "Built around how contractors actually work"
          text: >
            Your website should answer the questions customers have before
            they call: what you do, where you work, what kinds of jobs you
            handle, and how to get in touch.

        - heading: "Simple for customers. Manageable for you."
          text: >
            We focus on clear service information, strong calls to action,
            mobile-friendly design, local search foundations and an
            infrastructure you don't have to babysit.

      benefits:
        - "Clear service information"
        - "Mobile-first design"
        - "Local search foundations"
        - "Strong contact and call-to-action paths"
        - "Fast, lightweight pages"
        - "Hosting and ongoing maintenance"


  - id: hosting-maintenance
    title: "Hosting & Website Maintenance"
    short_title: "Hosting & Maintenance"
    category: "Keep the System Working"
    description: >
      Keep your website online, maintained and monitored without
      having to manage the technical details yourself.
    icon: "⌁"
    url: "/services/hosting-maintenance/"
    featured: false

    packages:
      foundation: true
      framework: true
      buildout: true

    page:
      headline: "Your website should stay online without becoming another job."
      intro: >
        A website isn't useful if it breaks, goes offline, or gets
        neglected after launch. We handle the routine maintenance and
        monitoring so you can focus on the work that actually pays you.

      sections:

        - heading: "The technical work stays in the background"
          text: >
            Hosting, SSL, routine maintenance and website health monitoring
            are handled as part of the service rather than becoming another
            list of things you have to remember.

        - heading: "Small changes shouldn't require a project"
          text: >
            Need to update a service, change a phone number, add information
            or make another minor adjustment? Your package includes a set
            number of minor website edits each month.

      benefits:
        - "Website hosting"
        - "SSL and security"
        - "Website health monitoring"
        - "Routine maintenance"
        - "Minor website updates"
        - "Managed website infrastructure"


  - id: google-business-profile
    title: "Google Business Profile"
    short_title: "Google Business Profile"
    category: "Get Found"
    description: >
      Set up and maintain your Google Business Profile so customers
      can find accurate information about your business.
    icon: "G"
    url: "/services/google-business-profile/"
    featured: true

    packages:
      foundation: true
      framework: true
      buildout: true

    page:
      headline: "Make your Google listing work as hard as your website."
      intro: >
        For many local customers, your Google Business Profile is the
        first thing they see. Accurate information and an active profile
        make it easier for people to understand what you do and contact you.

      sections:

        - heading: "Get the important details right"
          text: >
            We organize your business information, services, service areas,
            contact details and other core profile information so customers
            aren't left guessing.

        - heading: "Keep the profile active"
          text: >
            Ongoing management keeps your profile from becoming something
            that was set up once and then forgotten.

      benefits:
        - "Google Business Profile setup"
        - "Profile optimization"
        - "Business information management"
        - "Service and category optimization"
        - "Service-area management"
        - "Ongoing profile monitoring"


  - id: review-requests
    title: "Review Requests"
    short_title: "Review Requests"
    category: "Build Trust"
    description: >
      Make it easier to consistently ask satisfied customers for
      reviews after the job is complete.
    icon: "★"
    url: "/services/review-requests/"
    featured: false

    packages:
      foundation: true
      framework: true
      buildout: true

    page:
      headline: "Don't leave your best reviews to chance."
      intro: >
        Happy customers don't always remember to leave a review on their
        own. A simple follow-up process makes asking for feedback a normal
        part of finishing the job.

      sections:

        - heading: "Ask at the right time"
          text: >
            Review requests can be triggered as part of your existing
            customer follow-up process, rather than relying on someone
            to remember to send them manually.

        - heading: "Make it consistent"
          text: >
            Every completed job gets the same opportunity for follow-up,
            helping you build a more consistent review process over time.

      benefits:
        - "Automated review requests"
        - "Post-job follow-up"
        - "Customer review links"
        - "Review monitoring"
        - "Consistent follow-up process"
        - "Less manual outreach"


