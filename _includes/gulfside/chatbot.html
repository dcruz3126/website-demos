<button class="chat-toggle" id="chatToggle" aria-label="Open chat" aria-expanded="false" aria-controls="chatPanel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
</button>

<div class="chat-panel" id="chatPanel">
  <div class="chat-panel-header">
    <div><strong>Ask Gulfside</strong><span>Usually replies instantly</span></div>
    <button class="chat-close" id="chatClose" aria-label="Close chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="chat-log" id="chatLog">
    <div class="chat-msg chat-msg--bot">Hey there! Ask me about our hours, service area, pricing, or anything else. For real emergencies, just call (813) 555-0199.</div>
  </div>
  <div class="chat-chips">
    <button type="button" class="chat-chip">What are your hours?</button>
    <button type="button" class="chat-chip">Do you serve Brandon?</button>
    <button type="button" class="chat-chip">Is this an emergency line?</button>
  </div>
  <form class="chat-form" id="chatForm">
    <input type="text" id="chatInput" placeholder="Type a question..." autocomplete="off">
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
</div>
