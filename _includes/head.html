<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.data.business.name }}
    {% else %}
      {{ site.data.business.name }} | {{ site.data.business.tagline }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.data.business.description | strip_html | strip_newlines | escape }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >

  <link
    rel="icon"
    href="{{ '/assets/favicon.svg' | relative_url }}"
    type="image/svg+xml"
  >

  {% seo %}
</head>
