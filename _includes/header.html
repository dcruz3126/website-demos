<header class="site-header" id="site-header">

  <div class="container header-inner">


<a
  href="{{ '/' | relative_url }}"
  class="site-logo"
  aria-label="{{ site.data.business.name }} home"
>
  {{ site.data.business.name }}
</a>

<button
  class="mobile-menu-toggle"
  type="button"
  aria-expanded="false"
  aria-controls="main-navigation"
  aria-label="Open navigation"
>
  <span></span>
  <span></span>
  <span></span>
</button>

<nav class="site-nav" aria-label="Main navigation">

  {% for item in site.data.navigation.main %}

    {% if item.children %}

      <div class="nav-dropdown">

        <button
          type="button"
          class="nav-dropdown-toggle {% if page.url contains '/services/' %}active{% endif %}"
          aria-expanded="false"
        >
          <span>{{ item.title }}</span>
          <span class="dropdown-arrow" aria-hidden="true">▾</span>
        </button>

        <div class="nav-dropdown-menu">

          <a href="{{ item.url | relative_url }}">
            All Services
          </a>

          {% for child in item.children %}

            <a
              href="{{ child.url | relative_url }}"
              class="{% if page.url == child.url %}active{% endif %}"
            >
              {{ child.title }}
            </a>

          {% endfor %}

        </div>

      </div>

    {% else %}

      <a
        href="{{ item.url | relative_url }}"
        class="{% if page.url == item.url %}active{% endif %}"
      >
        {{ item.title }}
      </a>

    {% endif %}

  {% endfor %}

  <a
    href="{{ '/free-audit/' | relative_url }}"
    class="button button-small"
  >
    Free Website Audit
  </a>

</nav>


  </div>

</header>
